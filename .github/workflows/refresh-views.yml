name: Refresh solution views

# Owner decision 2026-11-25 (B-004): refresh the generated views hourly (was daily, 2026-11-24, F-005) and propose them
# as a PR, never a direct push to main. A run whose views changed only in the snapshot time or this repository's own
# revision opens no PR (tools/views-changed.mjs, B-004). Reads every component's main from GitHub; commits only docs/SOLUTION-DASHBOARD.md and
# docs/solution-order.md (Done items dropped by the template's tools/solution.mjs dashboard --prune-order,
# F-004-T02; the project's own overview was retired in F-004-T05) to the branch below and opens or updates the refresh PR, which merges itself on green CI
# (F-010, last step) unless it changes more than those generated files.
# Owner decision 2026-11-24 (F-008-T02, option B): the branch is pushed and the PR opened with the fine-grained token in
# the repository secret REFRESH_TOKEN, so the normal pull_request CI starts by itself (a push or PR made with the
# workflow token starts no workflow). The workflow token itself is read-only. The token is never printed; a missing
# secret fails the run. Only main's reviewed tools run here.
on:
  schedule:
    - cron: '17 * * * *' # hourly at :17 UTC, off the top of the hour (Actions may start it later)
  workflow_dispatch:

permissions:
  contents: read # the workflow token only reads; writes use REFRESH_TOKEN

concurrency:
  group: refresh-solution-views
  cancel-in-progress: false

env:
  BRANCH: chore/refresh-solution-views
  TITLE: 'chore: refresh solution views'

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: REFRESH_TOKEN must be set (no fallback to the workflow token)
        env:
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          if [ -z "$REFRESH_TOKEN" ]; then
            echo "::error title=REFRESH_TOKEN missing::The repository secret REFRESH_TOKEN is not set or not available to this run; the refresh PR would get no CI. Nothing was changed."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.REFRESH_TOKEN }} # git fetch and push use it, so pushes to the PR start CI
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Continue the open refresh PR (merging main; only view conflicts are resolved, to main's copy) or start from main
        env:
          GH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp tools/refresh-branch.mjs "$RUNNER_TEMP/refresh-branch.mjs" # main's reviewed copy, whatever the branch holds
          node "$RUNNER_TEMP/refresh-branch.mjs" "$BRANCH" # asks gh itself and stops on any lookup error

      - name: Run only main's reviewed tools
        run: git checkout origin/main -- tools package.json package-lock.json && git reset -q

      - name: Regenerate the dashboard with the template's tool and drop Done order items
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/solution.mjs dashboard --remote --write --prune-order

      - name: Offline checks
        run: node tools/check-backlog.mjs

      - name: Did anything change besides the snapshot time and this repository's own revision?
        id: diff
        run: |
          set +e
          node tools/views-changed.mjs # main's copy; exit 0 changed, 1 unchanged, 2 git error
          status=$?
          set -e
          if [ "$status" = 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = 1 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Views unchanged apart from the snapshot and this repository's revision; no PR."
          else
            echo "::error::Could not compare the views"
            exit 1
          fi

      - name: Commit, push, and open the PR if none is open (CI starts by itself on the token's push)
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          git add docs/SOLUTION-DASHBOARD.md docs/solution-order.md
          git commit -m "$TITLE" -m "Scheduled refresh (F-008): generated views from each component's main on GitHub."
          git push origin "HEAD:$BRANCH"
          open=$(gh pr list --head "$BRANCH" --state open --json number --jq length) || exit 1
          if [ "$open" = 0 ]; then
            gh pr create --base main --head "$BRANCH" --title "$TITLE" \
              --body "Scheduled refresh of the generated views (F-008). CI runs on this PR like on any other; it merges itself once every required check passes (F-010), unless its guard finds a change outside the generated files. Review the source revisions and each view's problems section."
          fi

      # Owner decision 2026-11-25 (F-010): a refresh PR merges itself once every required check on main passes, and its
      # branch is deleted. Only when it touches nothing but the generated views and, in the order, only drops items the
      # dashboard shows Closed (tools/refresh-guard.mjs, main's copy). Otherwise auto-merge stays off and the PR says why.
      - name: Let the PR merge itself on green, or say why not
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number') || exit 1
          [ -n "$pr" ] || { echo "::error::No open refresh PR found after the push"; exit 1; }
          set +e
          reasons=$(node tools/refresh-guard.mjs origin/main)
          status=$?
          set -e
          if [ "$status" = 0 ]; then
            gh pr merge "$pr" --auto --merge --delete-branch
            echo "Auto-merge enabled on #$pr."
          elif [ "$status" = 1 ]; then
            gh pr merge "$pr" --disable-auto >/dev/null 2>&1 || true # an earlier run may have enabled it
            printf 'Auto-merge is off for this refresh PR (F-010): it changes more than the generated files.\n\n%s\n\nA person reviews and lands it with merge-when-green.\n' "$reasons" > "$RUNNER_TEMP/guard.md"
            gh pr comment "$pr" --body-file "$RUNNER_TEMP/guard.md"
            echo "::warning title=Auto-merge not enabled::$reasons"
          else
            echo "::error::The refresh guard could not read the diff"
            exit 1
          fi
